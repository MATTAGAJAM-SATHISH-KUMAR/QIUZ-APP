_schema-version: "3.1"
ID: quiz-app
version: 1.0.0
description: Production-ready Quiz Application on SAP BTP CAPM

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ============================================================
  # CAP Backend Server
  # ============================================================
  - name: quiz-app-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: quiz-app-auth
      - name: quiz-app-db

  # ============================================================
  # HANA Database Deployer
  # ============================================================
  - name: quiz-app-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: quiz-app-db

  # ============================================================
  # Application Router (serves UI + proxies APIs)
  # ============================================================
  - name: quiz-app-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      buildpack: nodejs_buildpack
      memory: 128M
      disk-quota: 256M
      keep-existing-routes: true
    build-parameters:
      requires:
        - name: quiz-app-ui
          artifacts:
            - ./*
          target-path: resources
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: quiz-app-auth

  # ============================================================
  # SAPUI5 Frontend (webapp)
  # ============================================================
  - name: quiz-app-ui
    type: html5-content
    path: app/webapp
    build-parameters:
      builder: custom
      commands:
        - echo "No build step needed for SAPUI5 freestyle app"
      build-result: .
      supported-platforms: []

resources:
  # ============================================================
  # XSUAA Service Instance
  # ============================================================
  - name: quiz-app-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: quiz-app-${org}-${space}
        tenant-mode: shared

  # ============================================================
  # SAP HANA Cloud HDI Container
  # ============================================================
  - name: quiz-app-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
